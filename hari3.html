let i = 0;
const synth = window.speechSynthesis;

function update() {
    document.getElementById('text-indo').innerText = data[i].id;
    document.getElementById('text-en').innerText = data[i].en;
    document.getElementById('text-exp').innerText = data[i].exp;
    document.getElementById('answer-box').style.display = 'none';
    document.getElementById('btn-reveal').style.display = 'block';
    
    speak(data[i].id, 'id-ID');
}

function reveal() {
    document.getElementById('answer-box').style.display = 'block';
    document.getElementById('btn-reveal').style.display = 'none';
    speak(data[i].en, 'en-US');
}

function change(dir) {
    i = (i + dir + data.length) % data.length;
    update();
}

function speak(text, lang) {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    synth.speak(u);
}

update();
</script>
