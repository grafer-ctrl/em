  {id:"Menurutmu manusia paling membutuhkan ketenangan hati?", en:"Do you think people need inner peace the most?"},
  {id:"Apa hal yang membuatmu merasa benar-benar bahagia?", en:"What makes you feel truly happy?"},
  {id:"Menurutmu deep conversation membuat orang lebih dekat?", en:"Do you think deep conversations bring people closer?"},
  {id:"Apa arti koneksi yang sulit dijelaskan menurutmu?", en:"What does an unexplainable connection mean to you?"}
  
];

let index = 0;
const wordId = document.getElementById("wordId");
const wordEn = document.getElementById("wordEn");
const counter = document.getElementById("counter");

function render() {
    wordId.innerText = data[index].id;
    wordEn.innerText = data[index].en;
    wordEn.style.display = "none";
    counter.innerText = `${index + 1} / ${data.length}`;
    playAudio('id');
}

function playAudio(lang) {
    speechSynthesis.cancel();
    const text = (lang === 'id') ? data[index].id : data[index].en;
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = (lang === 'id') ? "id-ID" : "en-US";
    speechSynthesis.speak(speech);
}

function revealAnswer() {
    wordEn.style.display = "block";
    playAudio('en');
}

function prevWord() {
    index = (index - 1 + data.length) % data.length;
    render();
}

function nextWord() {
    index = (index + 1) % data.length;
    render();
}

render();
</script>
