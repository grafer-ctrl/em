body{

.topbar{

.home-btn {

.logo{ font-size:20px; font-weight:700; color:#2563eb; }

.progress{

    margin-bottom:30px;
}

.progress-fill{

.card{

.label{ color:#2563eb; font-weight:700; font-size:14px; letter-spacing:1px; margin-bottom:15px; }

.indonesia{ font-size:30px; font-weight:700; line-height:1.4; color:#111827; margin-bottom:25px; }

.blink{ font-size:18px; color:#ef4444; font-weight:700; animation:blink 1s infinite; margin-bottom:20px; }

@keyframes blink{ 0%{ opacity:1; } 50%{ opacity:0.2; } 100%{ opacity:1; } }

.english{ display:none; background:white; border-radius:20px; padding:20px; margin-top:20px; border:2px dashed #93c5fd; }

.english-text{ font-size:24px; color:#2563eb; font-weight:700; line-height:1.4; }

.buttons{ margin-top:35px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:15px; }

button{ border:none; border-radius:18px; padding:15px; font-size:14px; font-weight:600; cursor:pointer; transition:0.25s; }

.primary{ background:#2563eb; color:white; }
.primary:hover{ transform:translateY(-2px); background:#1d4ed8; }
.secondary{ background:#eff6ff; color:#2563eb; }
.secondary:hover{ background:#dbeafe; }
.success{ background:#10b981; color:white; }
.success:hover{ background:#059669; }

.footer{ margin-top:25px; text-align:center; color:#6b7280; font-size:14px; }
.auto{ margin-top:15px; display:flex; justify-content:center; gap:10px; align-items:center; color:#374151; font-size:14px; }

.switch{ position:relative; width:50px; height:26px; }
.switch input{ display:none; }
.slider{ position:absolute; cursor:pointer; inset:0; background:#cbd5e1; border-radius:30px; transition:0.3s; }
.slider:before{ content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:white; border-radius:50%; transition:0.3s; }
input:checked + .slider{ background:#2563eb; }
input:checked + .slider:before{ transform:translateX(24px); }

@media(max-width:600px){
    .indonesia{ font-size:24px; }
    .english-text{ font-size:20px; }
}

let index = 0;
const indoText = document.getElementById("indoText");
const englishText = document.getElementById("englishText");
const englishBox = document.getElementById("englishBox");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");

function render(){
    indoText.innerText = data[index].id;
    englishText.innerText = data[index].en;
    englishBox.style.display = "none";
    progressText.innerText = `${index + 1} / ${data.length}`;
    progressFill.style.width = `${((index + 1) / data.length) * 100}%`;
    if(document.getElementById("autoVoice").checked) setTimeout(speakIndo, 400);
}

function speakIndo(){
    speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(data[index].id);
    speech.lang = "id-ID";
    speechSynthesis.speak(speech);
}

function speakEnglish(){
    speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(data[index].en);
    speech.lang = "en-US";
    speechSynthesis.speak(speech);
}

function toggleEnglish(){
    if(englishBox.style.display === "block"){
        englishBox.style.display = "none";
    } else {
        englishBox.style.display = "block";
        speakEnglish();
    }
}

function nextSentence(){
    index = (index + 1) % data.length;
    render();
}

function randomSentence(){
    index = Math.floor(Math.random() * data.length);
    render();
}
